[project]
name = "bai-cao-graph-schema"
version = "0.1.0"
description = "BaiCao graph schema: node types, edge types and properties"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_schema"]
