[project]
name = "bai-cao-data-ingestion"
version = "0.1.0"
description = "Data ingestion boundary for BaiCao"
requires-python = ">=3.12"
dependencies = [
    "bai-cao-knowledge-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_ingestion"]

[tool.uv.sources]
bai-cao-knowledge-model = { path = "../knowledge_model", editable = true }
