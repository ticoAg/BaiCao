[project]
name = "bai-cao-knowledge-model"
version = "0.1.0"
description = "Shared knowledge model for BaiCao"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_model"]
