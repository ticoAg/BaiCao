[project]
name = "bai-cao-api"
version = "0.1.0"
description = "BaiCao ShiTan API Server"
requires-python = ">=3.12"
dependencies = [
    "bai-cao-graph-runtime",
    "bai-cao-data-ingestion",
    "bai-cao-knowledge-model",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.34.0",
    "loguru>=0.7.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.1",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.0.0",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "neo4j>=5.28.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "anthropic>=0.80.0",
    "python-dotenv>=1.0.1",
    "datasets>=2.14.0",
    "langgraph>=1.1.3",
    "langchain-anthropic>=1.4.0",
    "langchain-neo4j>=0.2.0",
    "neomodel>=6.0.0",
    "minio>=7.2.18",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "ty>=0.0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated tests for internal logic",
    "contract: API protocol and response shape tests",
    "integration: real dependency integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["../.."]

[tool.ty.src]
include = ["app", "tests"]

[tool.uv.sources]
bai-cao-graph-runtime = { path = "../graph_runtime", editable = true }
bai-cao-data-ingestion = { path = "../data_ingestion", editable = true }
bai-cao-knowledge-model = { path = "../knowledge_model", editable = true }
