[project]
name = "bai-cao-graph-runtime"
version = "0.1.0"
description = "Agent-first graph runtime for BaiCao"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_runtime"]
