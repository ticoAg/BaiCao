name: baicao

services:
  postgres:
    image: postgres:15-alpine
    container_name: baicao-postgres
    environment:
      POSTGRES_DB: baicao
      POSTGRES_USER: baicao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baicao_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baicao -d baicao -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: baicao-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
    volumes:
      - neo4j_data:/data
      - ./neo4j/conf:/conf:ro
    ports:
      - "17474:7474"
      - "17687:7687"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baicao-redis
    ports:
      - "16380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../packages/api
      dockerfile: Dockerfile
    container_name: baicao-api
    environment:
      DATABASE_URL: postgresql+asyncpg://baicao:${POSTGRES_PASSWORD:-baicao_password}@postgres:5432/baicao
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      REDIS_URL: redis://redis:6379
      DATABASE_PORT: "5432"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ../packages/web
      dockerfile: Dockerfile
    container_name: baicao-web
    depends_on:
      - api
    ports:
      - "13001:80"
    command: nginx -g 'daemon off;'

  nginx:
    image: nginx:alpine
    container_name: baicao-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18080:80"
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
